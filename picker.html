<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Manual</title>
</head>
<body>
    <h1>Shop Manual</h1>

    <label>Material
        <select id="material">
            <option value="">Choose…</option>
        </select>
    </label>
    <label>Objective
        <select id="objective">
            <option value="">Choose…</option>
        </select>
    </label>
    <label>Precision
        <select id="precision">
            <option value="">Choose…</option>
            <option value="1">Rough</option>
            <option value="2">Medium</option>
            <option value="3">Fine</option>
        </select>
    </label>
    <label>Thickness (inches, full piece)
        <input type="number" id="thickness" min="0" step="any">
    </label>
    <label>Length (inches, full piece)
        <input type="number" id="long" min="0" step="any">
    </label>
    <label>Width (inches, full piece)
        <input type="number" id="wide" min="0" step="any">
    </label>

    <button id="go">Search</button>
    <p id="message"></p>
    <ul id="results"></ul>

    <script src="data/tools.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/picker.js"></script>
</body>
</html>
